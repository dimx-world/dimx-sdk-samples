buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 28   // the DimensionX SDK needs Android 9 (ARCore)
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        // docs:begin repository
        // The native DimensionX Android SDK the bridge depends on is served from
        // this maven repository. It has to be declared by the app: Gradle resolves
        // a dependency's transitive artifacts with the consuming project's
        // repositories, so the bridge's own declaration is not enough.
        maven { url 'https://dl.dimx.world/sdk/android' }
        // docs:end
    }
}
