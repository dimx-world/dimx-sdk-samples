plugins {
    id 'com.android.application'
}

android {
    namespace 'world.dimx.sampleapp'
    compileSdk 36

    defaultConfig {
        applicationId 'world.dimx.sampleapp'
        // The SDK needs ARCore, which needs Android 9 (API 28) and OpenGL ES 3.
        minSdk 28
        // Play requires new apps to target Android 16 (API 36).
        targetSdk 36
        versionCode 2
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // docs:begin dependency
    // The DimensionX Android SDK, from https://dl.dimx.world/sdk/android (see
    // settings.gradle). Its pom brings appcompat, ARCore and the rest with it.
    implementation "world.dimx:dimx-android-sdk:0.1.2"
    // docs:end
}
